[package]
name = "modmaster-core"
description = "Núcleo do rsModMaster: Modbus RTU/TCP, scan, decodificação do bus monitor e sessões (sem UI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# sem libudev: o CI e o Linux do usuário não precisam do pacote de desenvolvimento
serialport = { version = "4", default-features = false }
# Lua 5.4 dos custom converters, o mesmo motor do garten-updater; `send` deixa a VM atrás de um Mutex
mlua = { version = "0.12", features = ["lua54", "vendored", "send"] }
serde.workspace = true
log.workspace = true
# preserve_order: o arquivo segue a ordem dos campos do `Settings`
toml = { version = "0.9", features = ["preserve_order"] }
